# Complemento SOMENTE do Supabase oficial self-hosted/v0.8.1.
# Retira nomes globais e portas públicas; alias só nas redes novas Aquila.
# Nenhum container de banco/Auth de Finance, laboratório ou Imob Flow é usado.
services:
  studio:
    container_name: !reset null
  api-gw:
    container_name: !reset null
    ports: !override
      - "127.0.0.1:${API_GW_HTTP_PORT:-18001}:8000"
    networks:
      default:
        aliases: [envoy, kong]
      aquila_supabase:
        aliases: [aquila-imob-envoy]
      aquila_ingress:
        aliases: [aquila-imob-envoy]
  auth:
    container_name: !reset null
    environment:
      GOTRUE_DISABLE_SIGNUP: "${DISABLE_SIGNUP:-false}"
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: "${GOTRUE_MAILER_TEMPLATES_CONFIRMATION:-}"
      GOTRUE_MAILER_TEMPLATES_RECOVERY: "${GOTRUE_MAILER_TEMPLATES_RECOVERY:-}"
    networks:
      default: {}
      aquila_supabase: {}
  rest:
    container_name: !reset null
  realtime:
    container_name: !reset null
    networks:
      default:
        aliases: [realtime-dev.supabase-realtime]
  storage:
    container_name: !reset null
  imgproxy:
    container_name: !reset null
  meta:
    container_name: !reset null
  functions:
    container_name: !reset null
  db:
    container_name: !reset null
    networks:
      default: {}
      aquila_supabase:
        aliases: [aquila-imob-db]
  supavisor:
    container_name: !reset null
    ports: !reset []

networks:
  aquila_supabase:
    external: true
    name: aquila-imob-supabase
  aquila_ingress:
    external: true
    name: aquila-imob-ingress
